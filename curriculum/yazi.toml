# Lessons 6 to 10: Yazi in the private herdr (design § 2.3). Schema: seams-phase2.md.
# Fixtures (yazi_backend.FIXTURES) are a fresh practice tree,
# Practice/{Projects/{planning.txt, timeline.txt}, .env, draft.txt, notes.txt, report.md},
# with the cursor on Projects («practice_tree») or on the named file («practice_tree@notes.txt»).
# Card ids are «yazi:<action>», the keys of yazi_backend.KEYMAP. Shown copy is English, terms
# as Yazi names them (folder, filter, selection, hovered file, hidden files).

[[lesson]]
id = "yazi-find"
order = 6
title = "Yazi: get around"
tool = "yazi"
fixture = "practice_tree"
intro = "Yazi is the file manager in your terminal. You practise in a folder of practice files of its own, so nothing real is touched."
pattern = "h, j, k and l are left, down, up and right: out of the folder, down, up and in."
steps = ["learn:yazi-in-out", "learn:yazi-bottom-top", "recall:yazi-in-out", "learn:yazi-hidden",
         "recall:yazi-bottom-top", "learn:yazi-filter", "recall:yazi-hidden", "recall:yazi-filter"]

[[scenario]]
id = "yazi-in-out"
goal = "Go into Projects, down to timeline.txt, and back out"
why = "The basic moves: in, down, out."
nudge = "Think in directions: right goes into the folder, down goes down, left goes out."
done = "In, down and back out"
cards = ["yazi:enter_folder", "yazi:next_file", "yazi:leave_folder"]
needs = [{ check = "cursor_on", entry = "Projects", folder = "Practice" }, { check = "no_filter" }]
checks = [{ check = "cwd_is", folder = "Projects" },
          { check = "hovered_is", entry = "timeline.txt" },
          { check = "cwd_is", folder = "Practice" }]
solution = ["yazi:enter_folder", "yazi:next_file", "yazi:leave_folder"]
decoy = "yazi:next_file"

[[scenario]]
id = "yazi-bottom-top"
goal = "Jump to the bottom of the list, then to the top"
why = "Long folders without holding down j."
nudge = "As in vim: one letter, uppercase for the bottom, lowercase twice for the top."
done = "Bottom and top"
cards = ["yazi:bottom", "yazi:top"]
fixture = "practice_tree@notes.txt"
needs = [{ check = "in_folder", folder = "Practice" }, { check = "cursor_middle" }, { check = "no_filter" }]
checks = [{ check = "hovered_last" }, { check = "hovered_first" }]
solution = ["yazi:bottom", "yazi:top"]
decoy = "yazi:top"

[[scenario]]
id = "yazi-hidden"
goal = "Show the hidden files"
why = "Find .env and other dotfiles."
nudge = "Hidden files are dotfiles. The key is the one they are named after."
done = "Hidden files are shown"
cards = ["yazi:toggle_hidden"]
needs = [{ check = "in_folder", folder = "Practice" }, { check = "hidden_off" }, { check = "no_filter" }]
checks = [{ check = "hidden_shown" }]
solution = ["yazi:toggle_hidden"]
decoy = "yazi:next_file"

[[scenario]]
id = "yazi-filter"
goal = "Filter the list to names with no"
why = "Narrow a long folder down as you type."
nudge = "The filter's key is its first letter. Type, then confirm with Enter."
done = "The list shows only matches for no"
cards = ["yazi:filter"]
needs = [{ check = "in_folder", folder = "Practice" }, { check = "no_filter" }]
checks = [{ check = "filter_is", text = "no" }]
solution = ["yazi:filter", { type = "no" }, { press = "enter" }]
decoy = "yazi:filter"
typing = true

[[lesson]]
id = "yazi-select"
order = 7
title = "Yazi: select and move"
tool = "yazi"
fixture = "practice_tree@draft.txt"
intro = "Select files, then copy or move them to another folder. The practice folder is fresh and untouched."
pattern = "Select first, then one key says what happens: y copies, x cuts, p pastes."
steps = ["learn:yazi-mark-one", "learn:yazi-range", "recall:yazi-mark-one", "learn:yazi-copy",
         "recall:yazi-range", "recall:yazi-copy", "build:yazi-move-two"]

[[scenario]]
id = "yazi-mark-one"
goal = "Select only notes.txt"
why = "Pick exactly the file you want to work on."
nudge = "Go to the file first. Selecting moves the cursor on afterwards."
done = "notes.txt is selected"
cards = ["yazi:mark_one"]
needs = [{ check = "cursor_on", entry = "draft.txt", folder = "Practice" },
         { check = "nothing_marked" }, { check = "no_filter" }]
checks = [{ check = "selection_is", names = ["notes.txt"] }]
solution = ["yazi:next_file", "yazi:mark_one"]
decoy = "yazi:mark_one"

[[scenario]]
id = "yazi-range"
goal = "Select the top three as one range"
why = "Many files in a row without pressing Space on each."
nudge = "Start a range, move down, and leave the mode. The selection stays."
done = "Three selected at once"
cards = ["yazi:visual", "yazi:escape"]
fixture = "practice_tree"
needs = [{ check = "cursor_on", entry = "Projects", folder = "Practice" }, { check = "nothing_marked" },
         { check = "hidden_off" }, { check = "no_filter" }]
checks = [{ check = "selection_is", names = ["Projects", "draft.txt", "notes.txt"] },
          { check = "visual_off", mode = "hold" }]
solution = ["yazi:visual", "yazi:next_file", "yazi:next_file", "yazi:escape"]
decoy = "yazi:visual"

[[scenario]]
id = "yazi-copy"
goal = "Copy notes.txt into Projects"
why = "The most common file job: copy, go, paste."
nudge = "Copy where the file is, go into the folder, and paste there."
done = "notes.txt is now in both places"
cards = ["yazi:yank", "yazi:paste"]
fixture = "practice_tree@notes.txt"
needs = [{ check = "cursor_on", entry = "notes.txt", folder = "Practice" }, { check = "nothing_marked" },
         { check = "clipboard_empty" }, { check = "fresh_tree" }, { check = "no_filter" }]
checks = [{ check = "file_in", file = "notes.txt", folder = "Projects" },
          { check = "file_in", file = "notes.txt", folder = "Practice", mode = "hold" }]
solution = ["yazi:yank", "yazi:top", "yazi:enter_folder", "yazi:paste"]
decoy = "yazi:paste"

[[scenario]]
id = "yazi-move-two"
goal = "Move draft.txt and notes.txt into Projects"
why = "Tidy two files away at once."
nudge = "Select both, cut instead of copying, and paste into Projects."
done = "Both files moved"
cards = ["yazi:mark_one", "yazi:cut", "yazi:paste"]
fixture = "practice_tree@draft.txt"
needs = [{ check = "cursor_on", entry = "draft.txt", folder = "Practice" }, { check = "nothing_marked" },
         { check = "clipboard_empty" }, { check = "fresh_tree" }, { check = "no_filter" }]
checks = [{ check = "file_in", file = "draft.txt", folder = "Projects", mode = "hold" },
          { check = "file_in", file = "notes.txt", folder = "Projects", mode = "hold" },
          { check = "file_gone", file = "draft.txt", folder = "Practice", mode = "hold" },
          { check = "file_gone", file = "notes.txt", folder = "Practice", mode = "hold" }]
solution = ["yazi:mark_one", "yazi:mark_one", "yazi:cut", "yazi:top", "yazi:enter_folder", "yazi:paste"]
decoy = "yazi:paste"

[[lesson]]
id = "yazi-paths"
order = 8
title = "Yazi: copy paths"
tool = "yazi"
fixture = "practice_tree@notes.txt"
intro = "Copy a file's path or name to paste elsewhere. Here the practice Yazi only reports what it would copy: your clipboard is left alone."
pattern = "c for copy, then what: c the full path, f only the file name, d the folder it is in."
steps = ["learn:yazi-copy-path", "learn:yazi-copy-filename", "recall:yazi-copy-path", "learn:yazi-copy-dirpath",
         "recall:yazi-copy-filename", "recall:yazi-copy-dirpath"]

[[scenario]]
id = "yazi-copy-path"
goal = "Copy the full path of notes.txt"
why = "Paste it into a terminal, a chat or a file dialog."
nudge = "Two keys: c for copy, then the same letter again."
done = "The full path is copied"
cards = ["yazi:copy_path"]
needs = [{ check = "cursor_on", entry = "notes.txt", folder = "Practice" }, { check = "nothing_copied" }]
checks = [{ check = "copied", what = "path", text = "Practice/notes.txt" }]
solution = ["yazi:copy_path"]
decoy = "yazi:next_file"

[[scenario]]
id = "yazi-copy-filename"
goal = "Copy only the file name of report.md"
why = "The name without any folders in front."
nudge = "c for copy, then f for file name."
done = "report.md is copied"
cards = ["yazi:copy_filename"]
fixture = "practice_tree@report.md"
needs = [{ check = "cursor_on", entry = "report.md", folder = "Practice" }, { check = "nothing_copied" }]
checks = [{ check = "copied", what = "filename", text = "report.md" }]
solution = ["yazi:copy_filename"]
decoy = "yazi:prev_file"

[[scenario]]
id = "yazi-copy-dirpath"
goal = "Copy the path of the folder notes.txt is in"
why = "For cd, or to point something at the folder."
nudge = "c for copy, then d for directory."
done = "The folder path is copied"
cards = ["yazi:copy_dirpath"]
needs = [{ check = "cursor_on", entry = "notes.txt", folder = "Practice" }, { check = "nothing_copied" }]
checks = [{ check = "copied", what = "dirpath", text = "Practice" }]
solution = ["yazi:copy_dirpath"]
decoy = "yazi:next_file"

[[lesson]]
id = "yazi-files"
order = 9
title = "Yazi: file tricks"
tool = "yazi"
fixture = "practice_tree@notes.txt"
intro = "Make, rename, trash and select files without leaving Yazi. Everything happens in the practice folder."
pattern = "One letter each: a adds, r renames, d trashes. Ctrl + a takes everything."
steps = ["learn:yazi-create", "learn:yazi-rename", "recall:yazi-create", "learn:yazi-trash",
         "recall:yazi-rename", "learn:yazi-select-all", "recall:yazi-trash", "recall:yazi-select-all"]

[[scenario]]
id = "yazi-create"
goal = "Create a file called todo.txt"
why = "A new file without opening an editor."
nudge = "a for add. Type the name, then Enter. A name ending in / makes a folder."
done = "todo.txt exists"
cards = ["yazi:create"]
needs = [{ check = "in_folder", folder = "Practice" }, { check = "fresh_tree" }]
checks = [{ check = "file_in", file = "todo.txt", folder = "Practice" }]
solution = ["yazi:create", { type = "todo.txt" }, { press = "enter" }]
decoy = "yazi:next_file"
typing = true

[[scenario]]
id = "yazi-rename"
goal = "Rename notes.txt to notes-old.txt"
why = "The cursor starts before the ending, so you only add to the name."
nudge = "r for rename. Type -old and press Enter."
done = "Renamed"
cards = ["yazi:rename"]
needs = [{ check = "cursor_on", entry = "notes.txt", folder = "Practice" }, { check = "fresh_tree" },
         { check = "nothing_marked" }]
checks = [{ check = "file_in", file = "notes-old.txt", folder = "Practice", mode = "hold" },
          { check = "file_gone", file = "notes.txt", folder = "Practice", mode = "hold" }]
solution = ["yazi:rename", { type = "-old" }, { press = "enter" }]
decoy = "yazi:next_file"
typing = true

[[scenario]]
id = "yazi-trash"
goal = "Move notes.txt to the trash"
why = "Gone from the folder, still recoverable."
nudge = "d, then confirm with Enter."
done = "notes.txt is in the trash"
cards = ["yazi:trash"]
needs = [{ check = "cursor_on", entry = "notes.txt", folder = "Practice" }, { check = "fresh_tree" },
         { check = "nothing_marked" }]
checks = [{ check = "file_trashed", file = "notes.txt", folder = "Practice" }]
solution = ["yazi:trash", { press = "enter" }]
decoy = "yazi:next_file"

[[scenario]]
id = "yazi-select-all"
goal = "Select everything in the folder"
why = "Copy or move the lot in one go."
nudge = "The usual select-all chord."
done = "Everything is selected"
cards = ["yazi:select_all"]
needs = [{ check = "in_folder", folder = "Practice" }, { check = "nothing_marked" }, { check = "hidden_off" },
         { check = "fresh_tree" }]
checks = [{ check = "selection_is", names = ["Projects", "draft.txt", "notes.txt", "report.md"] }]
solution = ["yazi:select_all"]
decoy = "yazi:next_file"

[[lesson]]
id = "yazi-navigate"
order = 10
title = "Yazi: back, forward, tabs"
tool = "yazi"
fixture = "practice_tree"
intro = "Retrace your steps and keep two places open at once."
pattern = "H and L go back and forward, like a browser. t t opens a new tab."
steps = ["learn:yazi-history", "learn:yazi-new-tab", "recall:yazi-history", "recall:yazi-new-tab"]

[[scenario]]
id = "yazi-history"
goal = "Go into Projects, jump back, then forward again"
why = "Return to where you were, wherever that was."
nudge = "Back and forward are the uppercase versions of the left and right keys."
done = "Back and forward"
cards = ["yazi:back", "yazi:forward"]
needs = [{ check = "cursor_on", entry = "Projects", folder = "Practice" }, { check = "one_tab" }]
checks = [{ check = "cwd_is", folder = "Projects" }, { check = "back_then_forward", folder = "Projects" }]
solution = ["yazi:enter_folder", "yazi:back", "yazi:forward"]
decoy = "yazi:enter_folder"

[[scenario]]
id = "yazi-new-tab"
goal = "Open a second tab in this folder"
why = "Keep this place while you look somewhere else."
nudge = "t for tab, twice."
done = "Two tabs open"
cards = ["yazi:new_tab"]
needs = [{ check = "in_folder", folder = "Practice" }, { check = "one_tab" }]
checks = [{ check = "tabs", count = 2, position = 2, folder = "Practice" }]
solution = ["yazi:new_tab"]
decoy = "yazi:next_file"
